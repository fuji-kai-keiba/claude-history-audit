name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks-bin/archive.tar.gz"
          cd "$RUNNER_TEMP/gitleaks-bin"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  archive.tar.gz' | sha256sum --check
          tar -xzf archive.tar.gz gitleaks
      - name: Scan reachable history with redacted findings
        shell: bash
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          touch "$RUNNER_TEMP/gitleaks-ignore"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore" \
            --ignore-gitleaks-allow --redact=100 --log-opts="--all"
